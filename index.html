<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Workspace</title>
    
    <!-- Highlight.js Tema -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">

    <style>
        :root {
            --bg-base: #000000;
            --glass-bg: rgba(28, 28, 30, 0.75);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-primary: #f5f5f7;
            --text-secondary: #86868b;
            --accent: #0a84ff; 
            --accent-glow: rgba(10, 132, 255, 0.2);
            --danger: #ff453a;
            --success: #32d74b;
            --admin-gold: #ffd60a;
            --mod-purple: #bf5af2;
            --mod-glow: rgba(191, 90, 242, 0.2);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif; 
            background-color: var(--bg-base); color: var(--text-primary); 
            height: 100vh; height: 100dvh; display: flex; overflow: hidden; 
            font-size: 14px; -webkit-font-smoothing: antialiased;
        }

        #login-overlay { 
            position: fixed; inset: 0; z-index: 100; 
            background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            display: flex; align-items: center; justify-content: center; padding: 20px;
        }
        .login-card { 
            background: var(--glass-bg); padding: 35px 30px; border-radius: 28px; 
            width: 100%; max-width: 340px; border: 1px solid var(--glass-border);
            box-shadow: 0 30px 60px rgba(0,0,0,0.5); text-align: center;
            position: relative; overflow: hidden;
        }
        .login-card h2 { font-size: 1.4rem; font-weight: 500; margin-bottom: 25px; }
        .login-card input { 
            width: 100%; padding: 14px 16px; margin-bottom: 8px; border-radius: 14px; 
            background: rgba(255,255,255,0.06); border: 1px solid transparent; 
            color: var(--text-primary); font-size: 1rem; outline: none; transition: 0.3s; 
        }
        .login-card input:focus { background: rgba(255,255,255,0.1); border-color: var(--accent); }
        #login-error { color: var(--danger); font-size: 0.8rem; min-height: 20px; margin-bottom: 10px; font-weight: 500; }
        
        .login-card button { 
            width: 100%; padding: 14px; border-radius: 14px; border: none; 
            background: var(--text-primary); color: #000; font-weight: 600; 
            font-size: 1rem; cursor: pointer; transition: 0.2s; margin-bottom: 15px; 
        }
        .login-card button:disabled { opacity: 0.5; cursor: not-allowed; }

        .admin-toggle { font-size: 0.85rem; color: var(--text-secondary); cursor: pointer; margin-top: 10px; display: inline-block;}
        
        #admin-section { display: none; margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--glass-border); }
        .admin-btn { background: transparent !important; color: var(--accent) !important; border: 1px solid var(--accent) !important; margin-bottom: 10px !important;}
        .mod-btn { background: transparent !important; color: var(--mod-purple) !important; border: 1px solid var(--mod-purple) !important; margin-bottom: 0 !important;}

        #loading-spinner {
            display: none; position: absolute; inset: 0; background: rgba(28, 28, 30, 0.95);
            backdrop-filter: blur(10px); flex-direction: column; align-items: center; justify-content: center; gap: 15px; z-index: 10;
        }
        .spinner {
            width: 32px; height: 32px; border: 3px solid rgba(255,255,255,0.1);
            border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-text { font-size: 0.9rem; color: var(--text-secondary); font-weight: 500; text-align: center; padding: 0 20px; }

        #app-layout { display: none; width: 100%; height: 100%; background: var(--bg-base); position: relative; }

        .sidebar { 
            width: 280px; background: rgba(20, 20, 22, 0.95); border-right: 1px solid var(--glass-border); 
            display: flex; flex-direction: column; backdrop-filter: blur(20px); z-index: 50;
            transition: transform 0.3s ease;
        }
        .sidebar-header { 
            padding: 20px; font-size: 0.75rem; color: var(--text-secondary); 
            font-weight: 600; text-transform: uppercase; letter-spacing: 0.8px;
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--glass-border);
        }
        .online-count-badge { background: rgba(255,255,255,0.1); padding: 2px 8px; border-radius: 10px; color: var(--text-primary); }
        #online-users { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 6px; }
        
        .user-item { 
            display: flex; align-items: center; justify-content: space-between; 
            padding: 10px 12px; border-radius: 12px; border: 1px solid transparent;
        }
        .user-item.is-admin {
            background: linear-gradient(90deg, var(--accent-glow) 0%, transparent 100%);
            border-left: 3px solid var(--accent);
        }
        .user-item.is-mod {
            background: linear-gradient(90deg, var(--mod-glow) 0%, transparent 100%);
            border-left: 3px solid var(--mod-purple);
        }

        .user-info { display: flex; align-items: center; gap: 8px; font-size: 0.9rem; }
        .status-dot { width: 8px; height: 8px; background: var(--success); border-radius: 50%; }
        .is-admin .status-dot { background: var(--accent); }
        .is-mod .status-dot { background: var(--mod-purple); }
        
        .admin-badge { background: var(--accent); color: white; font-size: 0.6rem; font-weight: 700; padding: 2px 5px; border-radius: 4px; }
        .mod-badge { background: var(--mod-purple); color: white; font-size: 0.6rem; font-weight: 700; padding: 2px 5px; border-radius: 4px; }
        
        .admin-actions { display: flex; gap: 4px; align-items: center; }
        .icon-btn { cursor: pointer; color: var(--text-secondary); font-size: 0.8rem; padding: 3px 6px; background: rgba(255,255,255,0.08); border-radius: 6px; transition: 0.2s; }
        .icon-btn:hover { background: rgba(255,255,255,0.2); color: var(--text-primary); }
        .icon-btn.kick:hover { color: var(--danger); }
        .icon-btn.mute:hover { color: var(--admin-gold); }

        .chat-area { flex: 1; display: flex; flex-direction: column; position: relative; height: 100%; overflow: hidden; }
        
        .chat-header { 
            padding: 15px 20px; border-bottom: 1px solid var(--glass-border); 
            background: rgba(0,0,0,0.8); backdrop-filter: blur(20px);
            display: flex; align-items: center; justify-content: space-between; z-index: 10;
        }
        .chat-header h1 { font-size: 1rem; font-weight: 500; }
        
        .mobile-menu-btn { 
            display: none; background: rgba(255,255,255,0.1); border: none; color: white; 
            padding: 6px 12px; border-radius: 8px; font-size: 0.8rem; cursor: pointer; 
        }

        #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }

        .message-card { 
            display: flex; flex-direction: column; padding: 12px 16px; 
            border-radius: 14px; background: var(--glass-bg); 
            width: 100%; border: 1px solid transparent;
        }
        .message-card.my-msg { border-left: 2px solid var(--accent); background: linear-gradient(90deg, rgba(10, 132, 255, 0.05) 0%, rgba(28,28,30,0.6) 100%); }

        .msg-header { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
        .sender-name { font-weight: 600; color: var(--text-primary); font-size: 0.9rem; }
        .sender-name.admin { color: var(--accent); }
        .sender-name.mod { color: var(--mod-purple); }
        .time-stamp { font-size: 0.7rem; color: var(--text-secondary); }

        /* Alıntı / Yanıt Kutusu Tasarımı */
        .reply-quote {
            background: rgba(255, 255, 255, 0.05);
            border-left: 3px solid var(--accent);
            padding: 6px 10px;
            border-radius: 6px;
            margin-bottom: 6px;
            font-size: 0.8rem;
            color: var(--text-secondary);
        }
        .reply-quote-name { font-weight: 600; color: var(--text-primary); }

        .msg-content { 
            font-family: 'SF Mono', 'Menlo', monospace; font-size: 0.9rem; 
            line-height: 1.5; white-space: pre-wrap; word-break: break-word; color: rgba(255,255,255,0.9);
        }
        
        .msg-content pre {
            background: rgba(15, 15, 17, 0.9) !important;
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            padding: 10px;
            margin: 6px 0;
            overflow-x: auto;
        }
        .msg-content code { font-family: 'SF Mono', 'Menlo', monospace; font-size: 0.85rem; }

        .msg-actions { display: flex; gap: 12px; margin-top: 8px; }
        .action-btn { 
            background: transparent; border: none; color: var(--text-secondary); 
            font-size: 0.75rem; cursor: pointer; display: flex; align-items: center; gap: 4px; font-weight: 500;
        }
        .copy-btn:hover { color: var(--text-primary); }
        .reply-btn:hover { color: var(--accent); }
        .delete-btn:hover { color: var(--danger); }

        .sys-msg { text-align: center; font-size: 0.75rem; color: var(--text-secondary); margin: 15px 0; }

        #typing-indicator {
            padding: 0 20px 6px 20px;
            font-size: 0.75rem;
            color: var(--text-secondary);
            font-style: italic;
            height: 18px;
        }

        #reply-preview {
            display: none;
            padding: 8px 14px;
            background: rgba(255, 255, 255, 0.05);
            border-top: 1px solid var(--glass-border);
            font-size: 0.85rem;
            color: var(--text-secondary);
            justify-content: space-between;
            align-items: center;
        }
        #reply-preview span { color: var(--accent); font-weight: 600; }
        .cancel-reply { cursor: pointer; color: var(--danger); font-size: 0.8rem; font-weight: 600; }

        .input-container { 
            background: rgba(0,0,0,0.9); 
            border-top: 1px solid var(--glass-border);
            backdrop-filter: blur(20px);
            z-index: 20;
        }
        .input-box-wrapper { padding: 12px 16px; padding-bottom: max(16px, env(safe-area-inset-bottom)); }
        .input-box { 
            display: flex; gap: 10px; background: rgba(28, 28, 30, 0.9); border: 1px solid var(--glass-border); 
            border-radius: 16px; padding: 10px 14px; align-items: flex-end;
        }
        .input-box textarea { 
            flex: 1; background: transparent; border: none; color: var(--text-primary); 
            resize: none; font-family: inherit; font-size: 0.95rem; 
            max-height: 120px; outline: none; line-height: 1.4;
        }
        .input-box textarea::placeholder { color: var(--text-secondary); }
        
        .input-actions-group { display: flex; align-items: center; gap: 8px; }
        .code-btn { 
            background: rgba(255, 255, 255, 0.08); color: var(--text-primary); border: none; 
            font-weight: 600; font-size: 0.8rem; cursor: pointer; padding: 6px 10px; border-radius: 8px; transition: 0.2s;
        }
        .code-btn:hover { background: rgba(255, 255, 255, 0.15); color: var(--accent); }
        
        .send-btn { 
            background: var(--accent); color: white; border: none; 
            font-weight: 600; font-size: 0.85rem; cursor: pointer; padding: 6px 12px; border-radius: 8px; transition: 0.2s;
        }
        .send-btn:hover { opacity: 0.9; }

        @media (max-width: 768px) {
            .mobile-menu-btn { display: block; }
            .sidebar { 
                position: absolute; left: 0; top: 0; bottom: 0; 
                transform: translateX(-100%); transition: transform 0.3s ease; 
            }
            .sidebar.mobile-open { transform: translateX(0); }
            #messages { padding: 15px; }
        }
    </style>
</head>
<body>

    <div id="login-overlay">
        <div class="login-card">
            <div id="loading-spinner">
                <div class="spinner"></div>
                <div class="loading-text" id="loading-msg">Sunucuya bağlanılıyor...</div>
            </div>

            <h2>Giriş Yap</h2>
            <input type="text" id="username" placeholder="Adınız" autocomplete="off" spellcheck="false" oninput="clientSideValidation()">
            <div id="login-error"></div>
            <button onclick="handleLoginClick('user')" id="joinBtn">Devam Et</button>
            
            <div class="admin-toggle" onclick="toggleAdmin()">Yetkili Girişi</div>
            
            <div id="admin-section">
                <input type="password" id="adminPassword" placeholder="Kurucu Şifresi" autocomplete="off" style="margin-bottom: 10px;">
                <button onclick="handleLoginClick('admin')" class="admin-btn">Kurucu Gir</button>
                
                <input type="password" id="modPassword" placeholder="Moderatör Şifresi" autocomplete="off" style="margin-bottom: 10px;">
                <button onclick="handleLoginClick('mod')" class="mod-btn">Moderatör Gir</button>
            </div>
        </div>
    </div>

    <div id="app-layout">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <span>Kişiler</span>
                <span class="online-count-badge" id="online-count">0</span>
            </div>
            <div id="online-users"></div>
        </aside>

        <main class="chat-area">
            <header class="chat-header">
                <button class="mobile-menu-btn" onclick="toggleMobileSidebar()">Kişiler</button>
                <h1>Workspace</h1>
                <div style="width: 50px;"></div>
            </header>
            
            <div id="messages" onclick="closeSidebarOnMobile()"></div>
            
            <div id="typing-indicator"></div>

            <div class="input-container">
                <div id="reply-preview">
                    <div>Yanıtlanan: <span id="reply-to-name"></span> - <span id="reply-to-text"></span></div>
                    <div class="cancel-reply" onclick="cancelReply()">İptal</div>
                </div>
                <div class="input-box-wrapper">
                    <div class="input-box">
                        <textarea id="messageInput" placeholder="Mesaj yazın..." rows="1" spellcheck="false" oninput="handleTypingInput(this)"></textarea>
                        <div class="input-actions-group">
                            <button class="code-btn" title="Kod Bloğu Ekle" onclick="sendAsCode()">&lt;/&gt;</button>
                            <button class="send-btn" onclick="sendMessage()">Gönder</button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/socket.io-client@4.7.5/dist/socket.io.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script>
        let socket = null;
        let myName = '';
        let userRole = 'user'; 
        let myPassword = '';
        let mySessionId = '';
        let activeReplyData = null; 
        let typingTimer = null;

        function clientSideValidation() {
            const input = document.getElementById('username');
            const errorDiv = document.getElementById('login-error');
            const btn = document.getElementById('joinBtn');
            const val = input.value.trim();
            errorDiv.innerText = '';
            btn.disabled = false;
            btn.style.opacity = '1';

            if(val.length > 0 && val.length < 3) {
                errorDiv.innerText = 'En az 3 karakter olmalı.';
                btn.disabled = true; btn.style.opacity = '0.5';
            } else if (!/^[a-zA-ZğüşıöçĞÜŞİÖÇ\s]*$/.test(val)) {
                errorDiv.innerText = 'Sadece harf kullanabilirsiniz.';
                btn.disabled = true; btn.style.opacity = '0.5';
            }
        }

        function toggleAdmin() {
            const adminSec = document.getElementById('admin-section');
            adminSec.style.display = adminSec.style.display === 'block' ? 'none' : 'block';
            document.getElementById('login-error').innerText = '';
        }

        function toggleMobileSidebar() {
            document.getElementById('sidebar').classList.toggle('mobile-open');
        }

        function closeSidebarOnMobile() {
            if(window.innerWidth <= 768) {
                document.getElementById('sidebar').classList.remove('mobile-open');
            }
        }

        function showLoading(show, text = "Sunucuya bağlanılıyor...") {
            const spinner = document.getElementById('loading-spinner');
            document.getElementById('loading-msg').innerText = text;
            spinner.style.display = show ? 'flex' : 'none';
        }

        function handleLoginClick(type) {
            const errorDiv = document.getElementById('login-error');
            errorDiv.innerText = '';

            if (type === 'user') {
                const nameInput = document.getElementById('username').value.trim();
                if (!nameInput) { errorDiv.innerText = 'Lütfen bir ad girin.'; return; }
                if (nameInput.length < 3) { errorDiv.innerText = 'İsim en az 3 karakter olmalıdır.'; return; }
                myName = nameInput;
                userRole = 'user';
                myPassword = '';
            } else if (type === 'admin') {
                const pass = document.getElementById('adminPassword').value;
                if (!pass) { errorDiv.innerText = 'Lütfen kurucu şifresini girin.'; return; }
                myName = 'Halit';
                userRole = 'admin';
                myPassword = pass;
            } else if (type === 'mod') {
                const pass = document.getElementById('modPassword').value;
                if (!pass) { errorDiv.innerText = 'Lütfen moderatör şifresini girin.'; return; }
                userRole = 'mod';
                myPassword = pass;
            }

            connectToServer();
        }

        function connectToServer() {
            showLoading(true, "Sunucuya bağlanılıyor (Render uyanıyor olabilir)...");

            if (socket) socket.disconnect();

            socket = io('https://chat-backend-qmzo.onrender.com', {
                transports: ['polling', 'websocket'],
                secure: true,
                reconnectionAttempts: 5,
                timeout: 45000
            });

            let isHandled = false;

            socket.on('connect_error', () => {
                if (isHandled) return;
                isHandled = true;
                showLoading(false);
                document.getElementById('login-error').innerText = 'Sunucuya bağlanılamadı. Linki kontrol edin veya tekrar deneyin.';
                socket.disconnect();
            });

            socket.on('connect', () => {
                setupSocketListeners();
                showLoading(true, "Odaya giriş yapılıyor...");

                socket.emit('joinRoom', { name: myName, isAdmin: userRole === 'admin', isMod: userRole === 'mod', password: myPassword }, (response) => {
                    if (isHandled) return;
                    isHandled = true;
                    showLoading(false);

                    if (!response.success) {
                        document.getElementById('login-error').innerText = response.message;
                        socket.disconnect(); 
                    } else {
                        myName = response.formattedName;
                        document.getElementById('login-overlay').style.opacity = '0';
                        setTimeout(() => {
                            document.getElementById('login-overlay').style.display = 'none';
                            document.getElementById('app-layout').style.display = 'flex';
                        }, 300);
                    }
                });
            });
        }

        function setupSocketListeners() {
            socket.off('kicked');
            socket.off('forceNameChange');
            socket.off('updateUserList');
            socket.off('receiveMessage');
            socket.off('systemMessage');
            socket.off('messageDeleted');
            socket.off('displayTyping');

            socket.on('kicked', () => { alert('Kurucu tarafından odadan atıldınız.'); location.reload(); });
            socket.on('forceNameChange', (newName) => { myName = newName; alert("Adınız '" + newName + "' olarak değiştirildi."); });

            socket.on('updateUserList', (users) => {
                const listDiv = document.getElementById('online-users');
                document.getElementById('online-count').innerText = users.length;
                listDiv.innerHTML = '';
                
                users.forEach(u => {
                    const isMe = (u.name === myName && u.role === userRole);
                    if(isMe) mySessionId = u.id;

                    const isAdminRole = u.role === 'admin';
                    const isModRole = u.role === 'mod';
                    
                    let roleClass = '', badgeHTML = '';
                    if (isAdminRole) { roleClass = 'is-admin'; badgeHTML = `<span class="admin-badge">KURUCU</span>`; }
                    if (isModRole) { roleClass = 'is-mod'; badgeHTML = `<span class="mod-badge">MOD</span>`; }

                    let adminActionsHTML = '';
                    if (userRole === 'admin' && !isAdminRole) {
                        const muteLabel = u.isMuted ? '🔊' : '🔇';
                        adminActionsHTML = `
                            <div class="admin-actions">
                                <span class="icon-btn" title="İsim Değiştir" onclick="renameUserModal('${u.id}', '${u.name}')">✎</span>
                                <span class="icon-btn mute" title="Sustur" onclick="toggleMuteUser('${u.id}')">${muteLabel}</span>
                                <span class="icon-btn kick" title="At" onclick="kickUser('${u.id}', '${u.name}')">✕</span>
                            </div>
                        `;
                    }

                    const el = document.createElement('div');
                    el.className = `user-item ${roleClass}`;
                    el.innerHTML = `
                        <div class="user-info">
                            <div class="status-dot"></div>
                            <span style="font-weight: ${isAdminRole || isModRole ? '600' : '400'}; color: ${isAdminRole ? 'var(--accent)' : isModRole ? 'var(--mod-purple)' : 'var(--text-primary)'}">
                                ${u.name} ${u.isMuted ? '(Susturuldu)' : ''}
                            </span>
                            ${badgeHTML}
                        </div>
                        ${adminActionsHTML}
                    `;
                    listDiv.appendChild(el);
                });
            });

            socket.on('receiveMessage', (data) => renderMessage(data));

            socket.on('systemMessage', (msg) => {
                const div = document.createElement('div');
                div.className = 'sys-msg'; div.innerText = msg;
                document.getElementById('messages').appendChild(div);
                scrollToBottom();
            });

            socket.on('messageDeleted', (msgId) => {
                const el = document.getElementById(`msg-${msgId}`);
                if (el) {
                    el.querySelector('.msg-content').innerHTML = '<span style="color: var(--text-secondary); font-style: italic;">Bu mesaj silindi.</span>';
                    el.querySelector('.msg-actions').style.display = 'none';
                    const quote = el.querySelector('.reply-quote');
                    if(quote) quote.remove();
                }
            });

            socket.on('displayTyping', (data) => {
                const typingDiv = document.getElementById('typing-indicator');
                if (data.isTyping) {
                    typingDiv.innerText = `${data.name} yazıyor...`;
                } else {
                    typingDiv.innerText = '';
                }
            });
        }

        function handleTypingInput(textarea) {
            textarea.style.height = '';
            textarea.style.height = textarea.scrollHeight + 'px';

            socket.emit('typing', { isTyping: true });
            clearTimeout(typingTimer);
            typingTimer = setTimeout(() => {
                socket.emit('typing', { isTyping: false });
            }, 1500);
        }

        // Yanıtla (Alıntı) İşlemi - Güvenli Parametre Aktarımı
        function prepareReply(id, name, text) {
            activeReplyData = { id, name, text };
            document.getElementById('reply-to-name').innerText = name;
            document.getElementById('reply-to-text').innerText = text.length > 30 ? text.substring(0, 30) + '...' : text;
            document.getElementById('reply-preview').style.display = 'flex';
            document.getElementById('messageInput').focus();
        }

        function cancelReply() {
            activeReplyData = null;
            document.getElementById('reply-preview').style.display = 'none';
        }

        function renameUserModal(targetId, currentName) {
            const newName = prompt(`Yeni ad:`);
            if (newName && newName.trim() !== '' && newName !== currentName) {
                socket.emit('renameUser', { targetId: targetId, newName: newName.trim(), password: myPassword });
            }
        }

        function kickUser(targetId, targetName) {
            if (confirm(`${targetName} adlı kullanıcıyı odadan atmak istediğinize emin misiniz?`)) {
                socket.emit('kickUser', { targetId: targetId, password: myPassword });
            }
        }

        function toggleMuteUser(targetId) {
            socket.emit('toggleMute', { targetId: targetId, password: myPassword });
        }

        function copyMsg(btn) {
            const contentDiv = btn.closest('.message-card').querySelector('.msg-content');
            navigator.clipboard.writeText(contentDiv.textContent).then(() => {
                const originalHTML = btn.innerHTML;
                btn.innerHTML = `Kopyalandı`;
                setTimeout(() => { btn.innerHTML = originalHTML; }, 2000);
            });
        }

        function renderMessage(data) {
            const isOwner = data.senderId === mySessionId;
            const isMe = (data.name === myName && data.role === userRole);
            
            const wrapper = document.createElement('div');
            wrapper.className = `message-card ${isMe ? 'my-msg' : ''}`;
            wrapper.id = `msg-${data.id}`;

            const canDelete = (userRole === 'admin' || userRole === 'mod' || isOwner);
            let deleteHTML = canDelete ? `<button class="action-btn delete-btn" onclick="deleteMsg('${data.id}')">Sil</button>` : '';

            let roleTag = '';
            if (data.role === 'admin') roleTag = `<span style="background:var(--accent); color:#fff; font-size:0.6rem; padding:1px 5px; border-radius:4px; margin-left:4px;">KURUCU</span>`;
            if (data.role === 'mod') roleTag = `<span style="background:var(--mod-purple); color:#fff; font-size:0.6rem; padding:1px 5px; border-radius:4px; margin-left:4px;">MOD</span>`;

            let nameClass = '';
            if (data.role === 'admin') nameClass = 'admin';
            if (data.role === 'mod') nameClass = 'mod';

            let replyHTML = '';
            if (data.replyTo) {
                replyHTML = `
                    <div class="reply-quote">
                        <div class="reply-quote-name">${escapeHTML(data.replyTo.name)}</div>
                        <div>${escapeHTML(data.replyTo.text)}</div>
                    </div>
                `;
            }

            // Yanıt butonuna veriyi güvenli aktarmak için base64 veya escape edilmiş string yerine data- attribute kullanıyoruz
            wrapper.innerHTML = `
                <div class="msg-header">
                    <span class="sender-name ${nameClass}">${data.name} ${roleTag}</span>
                    <span class="time-stamp">${data.time}</span>
                </div>
                ${replyHTML}
                <div class="msg-content">${formatMessageContent(data.message)}</div>
                <div class="msg-actions">
                    <button class="action-btn copy-btn" onclick="copyMsg(this)">Kopyala</button>
                    <button class="action-btn reply-btn" onclick="triggerReply('${data.id}', '${encodeURIComponent(data.name)}', '${encodeURIComponent(data.message)}')">Yanıtla</button>
                    ${deleteHTML}
                </div>
            `;
            
            document.getElementById('messages').appendChild(wrapper);
            
            wrapper.querySelectorAll('pre code').forEach((block) => {
                hljs.highlightElement(block);
            });

            scrollToBottom();
        }

        // Yanıt tetikleyici (parametre bozulmalarını önlemek için decode edilir)
        function triggerReply(id, encodedName, encodedText) {
            prepareReply(id, decodeURIComponent(encodedName), decodeURIComponent(encodedText));
        }

        function formatMessageContent(text) {
            const codeBlockRegex = /```([a-z]*)\n([\s\S]*?)```/g;
            let formatted = escapeHTML(text);

            formatted = formatted.replace(codeBlockRegex, (match, lang, code) => {
                return `<pre><code class="${lang}">${code.trim()}</code></pre>`;
            });

            return formatted;
        }

        // Normal Gönder Butonu
        function sendMessage() {
            dispatchMessage(document.getElementById('messageInput').value);
        }

        // </&gt; Kod Butonu: Metni otomatik 3 ters tırnak içine alır
        function sendAsCode() {
            const input = document.getElementById('messageInput');
            const val = input.value.trim();
            if (!val) return;
            const codeWrapped = "```\n" + val + "\n```";
            dispatchMessage(codeWrapped);
        }

        function dispatchMessage(msgText) {
            const msg = msgText.trim();
            if (msg) {
                socket.emit('typing', { isTyping: false });
                
                let replyPayload = null;
                if (activeReplyData) {
                    replyPayload = { name: activeReplyData.name, text: activeReplyData.text };
                    cancelReply();
                }

                socket.emit('sendMessage', { message: msg, replyTo: replyPayload });
                const input = document.getElementById('messageInput');
                input.value = '';
                input.style.height = 'auto';
                input.focus();
            }
        }

        function deleteMsg(id) {
            socket.emit('deleteMessage', { msgId: id, password: myPassword });
        }

        function scrollToBottom() {
            const m = document.getElementById('messages');
            m.scrollTop = m.scrollHeight;
        }

        document.getElementById('messageInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
        }
    </script>
</body>
</html>
